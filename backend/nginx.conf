worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;

        # CORS headers on every response
        add_header 'Access-Control-Allow-Origin'  '*'                                                              always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'                         always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With'          always;
        add_header 'Access-Control-Max-Age'        '86400'                                                          always;

        # Handle OPTIONS preflight directly — no PHP needed
        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;

            # Also add CORS on PHP responses (location overrides server block)
            add_header 'Access-Control-Allow-Origin'  '*'                                                          always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'                     always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With'      always;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
